<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Trainingsplan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1 class="phase-name"><span class="phase-icon" aria-hidden="true">🏄</span> Malediven Trainingsplan</h1>
      <div class="header-actions">
        <a href="inputform.html" class="btn btn-primary">Profil</a>
        <label class="btn btn-secondary">
          Import
          <input type="file" id="import-file" accept="application/json" hidden>
        </label>
        <button class="btn btn-secondary" id="export-btn">Export</button>
      </div>
    </div>
    <div class="header-bottom">
      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">Noch keine Einheiten geplant</div>
      </div>
    </div>
  </header>

  <nav class="week-tabs" id="week-tabs"></nav>

  <main class="week-view">
    <div class="week-header">
      <div class="week-title-block">
        <div class="week-eyebrow">Wochenziel</div>
        <h2 class="week-goal" id="week-goal">Wochenziel</h2>
      </div>
      <span class="week-progress" id="week-progress">0 / 0 Einheiten erledigt</span>
    </div>
    <div class="days-list" id="days-list"></div>
    <div class="week-quote" id="quote">„Jeder Schritt zählt."</div>
  </main>

  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2 id="edit-title">Einheit bearbeiten</h2>
      <p class="edit-unit-title" id="edit-unit-title"></p>
      <label>
        Wochentag
        <select name="weekday" required>
          <option value="0">Montag</option>
          <option value="1">Dienstag</option>
          <option value="2">Mittwoch</option>
          <option value="3">Donnerstag</option>
          <option value="4">Freitag</option>
          <option value="5">Samstag</option>
          <option value="6">Sonntag</option>
        </select>
      </label>
      <label>
        Kategorie
        <select name="category" required>
          <option value="mobility">Mobility</option>
          <option value="yoga">Yoga</option>
          <option value="rad">Rad / Cardio</option>
          <option value="paddeln">Paddeln</option>
          <option value="kraft">Kraft</option>
          <option value="hiit">HIIT</option>
          <option value="erholung">Erholung</option>
        </select>
      </label>
      <label>
        Dauer (Minuten)
        <input type="number" name="duration" min="0" step="5" placeholder="z. B. 45">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
