<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Trainingsplan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1 class="phase-name" contenteditable="true" spellcheck="false">Meine Trainingsphase</h1>
      <div class="header-actions">
        <label class="btn btn-secondary">
          Import
          <input type="file" id="import-file" accept="application/json" hidden>
        </label>
        <button class="btn btn-secondary" id="export-btn">Export</button>
      </div>
    </div>
    <div class="header-bottom">
      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">Noch keine Einheiten geplant</div>
      </div>
      <div class="quote" id="quote">„Jeder Schritt zählt."</div>
    </div>
  </header>

  <nav class="week-tabs" id="week-tabs"></nav>

  <main class="week-view">
    <div class="week-header">
      <label for="week-goal" class="week-goal-label">Wochenziel</label>
      <input type="text" class="week-goal" id="week-goal" placeholder="z. B. Grundlagenausdauer aufbauen">
      <span class="week-progress" id="week-progress">0 / 0 Einheiten erledigt</span>
    </div>
    <div class="days-grid" id="days-grid"></div>
  </main>

  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2 id="edit-title">Einheit bearbeiten</h2>
      <label>
        Kategorie
        <select name="category" required>
          <option value="">Bitte wählen</option>
          <option value="yoga">Yoga / Mobility</option>
          <option value="rad">Rad / Cardio</option>
          <option value="paddeln">Paddeln</option>
          <option value="kraft">Kraft</option>
          <option value="schwimmen">Schwimmen</option>
          <option value="erholung">Erholung</option>
        </select>
      </label>
      <label>
        Titel
        <input type="text" name="title" placeholder="z. B. Lockere Radtour" required>
      </label>
      <label>
        Dauer (Minuten)
        <input type="number" name="duration" min="0" step="5" placeholder="z. B. 45">
      </label>
      <label>
        Beschreibung
        <textarea name="description" rows="3" placeholder="Details, Intensität, Notizen"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-danger" id="delete-btn">Löschen</button>
        <button type="button" class="btn btn-secondary" id="cancel-btn">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
